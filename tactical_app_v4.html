<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>极速战术指挥系统 v4.0</title>
    <!-- 性能加速：预解析 CDN 域名 -->
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 核心优化：开启 GPU 渲染加速 */
        * { -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            background-color: #05070A; 
            color: #E2E8F0; 
            font-family: system-ui, -apple-system, sans-serif;
            text-rendering: optimizeLegibility; /* 文本渲染优化 */
            overscroll-behavior-y: contain; /* 防止下拉刷新导致的延迟 */
        }

        .tactical-card {
            background: #111827;
            transform: translateZ(0); /* 强制开启 GPU 加速 */
            will-change: transform, opacity;
            transition: transform 0.1s cubic-bezier(0.2, 0, 0.2, 1);
            contain: layout; /* 布局隔离，提升渲染性能 */
        }

        .tactical-card:active { transform: scale(0.97); }

        /* 夜视模式极端优化 */
        .night-vision { background-color: #0A0000 !important; }
        .night-vision .tactical-card { background: #1A0000 !important; border: 1px solid #440000 !important; }
        .night-vision * { color: #FF0000 !important; }

        /* 滚动条极简 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 骨架屏动画 */
        @keyframes pulse { 50% { opacity: .5; } }
        .loading { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="pb-24">

    <!-- 顶部状态栏 -->
    <header class="sticky top-0 z-50 bg-[#05070A]/90 backdrop-blur-xl border-b border-slate-800 p-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10B981]"></div>
                <h1 class="text-sm font-black tracking-tighter uppercase">Tactical Engine v4.0</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleNightVision()" class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-red-500"><i class="fa-solid fa-eye text-xs"></i></button>
                <button onclick="openQuiz()" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-[10px] font-bold">START DRILL</button>
            </div>
        </div>
        
        <!-- 高性能搜索框 -->
        <div class="mt-4 relative">
            <input type="text" id="searchInput" oninput="optimizedSearch()" placeholder="输入指令关键词..." 
                   class="w-full bg-slate-900/50 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-xs focus:ring-1 focus:ring-emerald-500 transition-all">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-600 text-xs"></i>
        </div>
    </header>

    <!-- 极速渲染列表区 -->
    <div id="wordContainer" class="p-4 space-y-3">
        <!-- JS 动态注入 -->
    </div>

    <!-- 全屏威慑闪卡 (物理性能最高) -->
    <div id="flashModal" class="fixed inset-0 bg-black z-[100] hidden flex-col items-center justify-center p-6" onclick="this.classList.add('hidden')">
        <div id="flashZh" class="text-6xl font-black text-amber-500 mb-8"></div>
        <div id="flashSwa" class="text-5xl font-bold text-white text-center"></div>
        <div id="flashPy" class="text-xl text-slate-400 mt-4"></div>
    </div>

    <script>
        // 核心数据 (由系统初始化)
        let rawData = []; // 此处填入您那100个词
        
        // 性能引擎组件
        const Engine = {
            // 1. 防抖处理：避免输入过快导致渲染卡顿
            timer: null,
            
            // 2. 异步渲染引擎：分片加载防止掉帧
            async render(data) {
                const container = document.getElementById('wordContainer');
                container.innerHTML = ''; 
                
                // 使用 DocumentFragment 减少重排
                const fragment = document.createDocumentFragment();
                
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'tactical-card p-4 rounded-2xl border border-slate-800 flex items-center justify-between';
                    div.onclick = () => Engine.flash(item);
                    div.innerHTML = `
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[9px] bg-slate-800 px-1 rounded text-slate-400 font-mono">#${item.id}</span>
                                <span class="text-sm font-bold text-slate-200">${item.zh}</span>
                            </div>
                            <div class="text-lg font-black text-emerald-400 font-mono">${item.swa}</div>
                            <div class="text-[10px] text-slate-500">拟音: ${item.py}</div>
                        </div>
                        <i class="fa-solid fa-volume-high text-slate-700"></i>
                    `;
                    fragment.appendChild(div);
                });
                
                requestAnimationFrame(() => {
                    container.appendChild(fragment);
                });
            },

            // 3. 闪卡调用
            flash(item) {
                document.getElementById('flashZh').innerText = item.zh;
                document.getElementById('flashSwa').innerText = item.swa;
                document.getElementById('flashPy').innerText = `拟音：${item.py}`;
                document.getElementById('flashModal').classList.remove('hidden');
                this.speak(item.swa);
            },

            // 4. 语音预处理
            speak(text) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'fr-FR'; // 斯瓦希里语在法语语境下发音更准
                msg.rate = 0.9;
                window.speechSynthesis.speak(msg);
            }
        };

        // 搜索优化
        function optimizedSearch() {
            clearTimeout(Engine.timer);
            Engine.timer = setTimeout(() => {
                const kw = document.getElementById('searchInput').value.toLowerCase();
                const filtered = rawData.filter(i => 
                    i.zh.includes(kw) || i.swa.toLowerCase().includes(kw) || i.py.includes(kw)
                );
                Engine.render(filtered);
            }, 100); // 100ms 延迟过滤，保证打字流畅
        }

        // 初始化数据加载
        async function initSystem() {
            // 此处填入您的 100 个词数据...
            rawData = [
                {id:1, cat:"指挥", zh:"领导/首长", swa:"Boss", py:"波丝"},
                {id:2, cat:"指挥", zh:"警察", swa:"Polisi", py:"波利斯"},
                // ... (此处省略至100个词)
                {id:100, cat:"日常", zh:"检查", swa:"Angalia", py:"安格利亚"}
            ];
            Engine.render(rawData);
        }

        function toggleNightVision() {
            document.body.classList.toggle('night-vision');
        }

        window.onload = initSystem;
    </script>
</body>
</html>
