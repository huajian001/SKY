<!DOCTYPE html>
<html lang="zh-CN">

    <meta charset="UTF-8">

    <title>极速战术指挥系统 v4.0</title>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 核心优化：全系统触控防延迟与硬件加速 */
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        body { 
            background-color: #05070A; 
            color: #E2E8F0; 
            font-family: system-ui, -apple-system, sans-serif;
            text-rendering: optimizeLegibility;
            overscroll-behavior-y: contain; /* 禁用下拉刷新，防止手势冲突 */
        }

        /* 战术卡片：强制开启显卡 GPU 渲染层 */
        .tactical-card {
            background: #0F172A;
            transform: translate3d(0,0,0); /* 开启 3D 硬件加速 */
            will-change: transform, opacity;
            contain: layout; /* 布局隔离优化，避免全局重排 */
            transition: transform 0.08s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .tactical-card:active { transform: scale(0.96) translate3d(0,0,0); background: #1E293B; }

        /* 夜视红光滤镜极端加速 */
        .night-vision { background-color: #0A0000 !important; }
        .night-vision .tactical-card { background: #1A0000 !important; border: 1px solid #550000 !important; }
        .night-vision .tactical-card:active { background: #2D0000 !important; }
        .night-vision * { color: #FF3333 !important; border-color: #440000 !important; }
        .night-vision .accent-text { color: #FFAAAA !important; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { background: #0284C7; color: white; border-color: #38BDF8; }
    </style>
</head>

            {id:100, cat:"六、协调与日常", zh:"看看/检查", swa:"Angalia", py:"安格利亚"}

        let currentCat = "全部";
        let searchTimer = null;

        // 核心优化引擎组件
        const Engine = {
            // 使用 DocumentFragment + requestAnimationFrame 达成极致的 DOM 渲染
            render(data) {
                const container = document.getElementById('wordContainer');
                container.innerHTML = ''; 
                
                const fragment = document.createDocumentFragment();
                const isAll = currentCat === "全部";
                
                // 单次 $O(n)$ 线性过滤
                const filtered = data.filter(item => {
                    if (!isAll && item.cat !== currentCat) return false;
                    const kw = document.getElementById('searchInput').value.trim().toLowerCase();
                    if (!kw) return true;
                    return item.zh.includes(kw) || item.swa.toLowerCase().includes(kw) || item.py.includes(kw);
                });

                document.getElementById('resultCount').innerText = filtered.length;

                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'tactical-card p-4 rounded-xl border border-slate-800/80 flex items-center justify-between';
                    card.onclick = () => Engine.triggerFlash(item);
                    card.innerHTML = `
                        <div class="min-w-0 flex-1 pr-2">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-[9px] text-slate-600 font-mono font-bold">#${String(item.id).padStart(3,'0')}</span>
                                <span class="text-xs font-bold text-slate-300 accent-text">${item.zh}</span>
                            </div>
                            <div class="text-base font-black text-sky-400 font-mono tracking-wide">${item.swa}</div>
                            <div class="text-[10px] text-slate-500 font-medium">拟音：${item.py}</div>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center border border-slate-800 text-slate-500"><i class="fa-solid fa-volume-high text-[10px]"></i></div>
                    `;
                    fragment.appendChild(card);
                });

                // 配合系统同步帧率刷新画面
                requestAnimationFrame(() => {
                    container.appendChild(fragment);
                });
            },

            triggerFlash(item) {
                document.getElementById('flashZh').innerText = item.zh;
                document.getElementById('flashSwa').innerText = item.swa;
                document.getElementById('flashPy').innerText = `拟音：${item.py}`;
                document.getElementById('flashModal').classList.remove('hidden');
                this.speak(item.swa);
            },

            speak(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // 强行斩断上一次发音队列，防内存堆积
                    const msg = new SpeechSynthesisUtterance(text);
                    msg.lang = 'fr-FR'; // 法语声道最贴近东非当地斯瓦希里语口音语调
                    msg.rate = 0.88; // 略微调慢语速确保听得清
                    window.speechSynthesis.speak(msg);
                }
            }
        };

        // 100ms 智能防抖过滤，极大缓解高速输入时的设备 CPU 响应负荷
        function optimizedSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => Engine.render(rawData), 100);
        }

        function renderTabs() {
            const tabs = ["全部", "一、指挥与身份", "二、行动指令", "三、战术方位", "四、装备与资源", "五、应急与状态", "六、协调与日常"];
            document.getElementById('categoryTabs').innerHTML = tabs.map(t => `
                <button onclick="switchCat('${t}')" class="px-3 py-1.5 rounded-xl text-[11px] font-bold whitespace-nowrap border border-slate-800 bg-slate-900/60 text-slate-400 transition-colors ${currentCat === t ? 'tab-active' : ''}">
                    ${t.includes('、') ? t.split('、')[1] : t}
                </button>
            `).join('');
        }

        function switchCat(cat) {
            currentCat = cat;
            renderTabs();
            Engine.render(rawData);
        }

        function toggleNightVision() {
            document.body.classList.toggle('night-vision');
            document.getElementById('headerNav').classList.toggle('night-vision');
            document.getElementById('quizModal').classList.toggle('night-vision');
        }

        // --- 测验控制系统组件 ---
        let qQueue = [], qIdx = 0, qScore = 0, qSelected = false;
        function openQuiz() {
            qQueue = [...rawData].sort(() => 0.5 - Math.random()).slice(0, 10);
            qIdx = 0; qScore = 0;
            document.getElementById('quizModal').classList.remove('hidden');
            loadQuiz();
        }
        function closeQuiz() { document.getElementById('quizModal').classList.add('hidden'); }
        function loadQuiz() {
            qSelected = false;
            const nextBtn = document.getElementById('quizNextBtn');
            nextBtn.disabled = true;
            nextBtn.className = "w-full py-3.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-600 text-xs font-bold";
            nextBtn.innerText = "请选择正确战术含义";
            
            const cur = qQueue[qIdx];
            document.getElementById('quizProgress').innerText = `${qIdx + 1} / 10`;
            document.getElementById('quizScore').innerText = qScore;
            document.getElementById('quizQuestionWord').innerText = cur.swa;
            document.getElementById('quizQuestionPinyin').innerText = cur.py;

            let options = [cur, ...rawData.filter(w => w.id !== cur.id).sort(() => 0.5 - Math.random()).slice(0, 3)].sort(() => 0.5 - Math.random());
            document.getElementById('quizOptionsContainer').innerHTML = options.map((opt, i) => `
                <button onclick="verifyQuiz(${opt.id === cur.id}, this)" class="quiz-opt w-full p-3.5 rounded-xl bg-slate-900 border border-slate-800/80 text-left text-xs font-bold flex justify-between items-center active:scale-[0.99]">
                    <span>${i + 1}. ${opt.zh}</span>
                    <span class="text-[9px] text-slate-600 font-mono">${opt.cat.substring(2)}</span>
                </button>
            `).join('');
            Engine.speak(cur.swa);
        }
        function verifyQuiz(isCorrect, element) {
            if (qSelected) return;
            qSelected = true;
            const opts = document.querySelectorAll('.quiz-opt');
            opts.forEach(btn => btn.style.opacity = "0.3");
            element.style.opacity = "1";
            
            if (isCorrect) {
                element.className = "quiz-opt w-full p-3.5 rounded-xl bg-emerald-950/70 border-2 border-emerald-500 text-emerald-400 text-left text-xs font-black flex justify-between items-center";
                qScore += 10;
                document.getElementById('quizScore').innerText = qScore;
            } else {
                element.className = "quiz-opt w-full p-3.5 rounded-xl bg-red-950/70 border-2 border-red-500 text-red-400 text-left text-xs font-black flex justify-between items-center";
            }
            
            const nextBtn = document.getElementById('quizNextBtn');
            nextBtn.disabled = false;
            nextBtn.className = "w-full py-3.5 rounded-xl bg-sky-600 text-white text-xs font-bold shadow-lg shadow-sky-950";
            nextBtn.innerText = qIdx === 9 ? "查看考核报告" : "进入下一题";
        }
        function nextQuiz() {
            if (qIdx < 9) { qIdx++; loadQuiz(); } 
            else {
                let rank = qScore >= 90 ? "优秀指挥官" : qScore >= 70 ? "合格指战员" : "需加强训练";
                document.getElementById('quizOptionsContainer').innerHTML = `
                    <div class="text-center py-6 space-y-2">
                        <div class="text-5xl font-black text-amber-500 font-mono">${qScore} <span class="text-xs text-slate-500">得分</span></div>
                        <div class="text-xs font-bold text-slate-300">战术判定：<span class="text-emerald-400">${rank}</span></div>
                    </div>`;
                const nextBtn = document.getElementById('quizNextBtn');
                nextBtn.innerText = "重新考核";
                nextBtn.onclick = () => { nextBtn.onclick = nextQuiz; openQuiz(); };
            }
        }

        // 初始化
        window.onload = () => {
            renderTabs();
            Engine.render(rawData);
        };
    </script>
</body>
</html>
