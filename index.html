            font-family: 'Noto Sans SC', system-ui, sans-serif;
        }
        
        .term-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .term-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        
        .nav-link {
            position: relative;
        }
        
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: #3b82f6;
            transition: width 0.3s ease;
        }
        
        .nav-link:hover:after,
        .nav-link.active:after {
            width: 100%;
        }
        
        .search-input {
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
    </style>

        // 渲染类别导航
        function renderCategories() {
            const nav = document.getElementById('categoryNav');
            let html = `
                <div onclick="filterByCategory('all')" class="category-item px-4 py-3 mx-2 rounded-2xl flex items-center gap-3 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 active:bg-blue-50 mb-1" id="cat-all">

                    <span class="font-medium">全部术语</span>
                </div>
            `;
            
            categories.forEach(cat => {
                const count = terms.filter(t => t.category === cat).length;
                html += `
                    <div onclick="filterByCategory('\( {cat}')" class="category-item px-4 py-3 mx-2 rounded-2xl flex items-center gap-3 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 active:bg-blue-50 mb-1" id="cat- \){cat}">

                        <span class="font-medium">${cat}</span>
                        <span class="ml-auto text-xs bg-gray-200 dark:bg-gray-600 px-2 py-0.5 rounded-full">${count}</span>
                    </div>
                `;
            });
            nav.innerHTML = html;
        }

        // 渲染术语卡片
        function renderTerms(filteredTerms) {
            const grid = document.getElementById('termsGrid');
            let html = '';
            
            filteredTerms.forEach(term => {
                html += `
                    <div onclick="showDetail(${term.id})" class="term-card bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-3xl p-6 cursor-pointer">
                        <div class="flex justify-between items-start mb-4">
                            <div class="text-3xl font-bold text-blue-600">${term.num}</div>
                            <div class="text-xs uppercase tracking-widest bg-amber-100 dark:bg-amber-900 text-amber-600 dark:text-amber-300 px-3 py-1 rounded-2xl">${term.category}</div>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <div class="text-gray-500 dark:text-gray-400 text-sm">中文</div>
                                <div class="text-xl font-semibold">${term.zh}</div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <div class="text-gray-500 dark:text-gray-400 text-sm">参考</div>
                                    <div class="font-mono">${term.ref}</div>
                                </div>
                                <div>
                                    <div class="text-gray-500 dark:text-gray-400 text-sm">推荐音译</div>
                                    <div class="font-medium text-lg">${term.trans}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            grid.innerHTML = html || `<div class="col-span-3 text-center py-20 text-gray-400">没有找到匹配的术语</div>`;
            document.getElementById('resultCount').textContent = `${filteredTerms.length} 条结果`;
        }

                    </div>
                    <div class="text-right">
                        <div class="text-sm text-gray-500">${term.category}</div>
                    </div>
                </div>

                    <div class="text-4xl font-bold leading-tight">${term.zh}</div>
                </div>
                
                <div class="grid grid-cols-1 gap-8">
                    <div class="border-l-4 border-blue-500 pl-6">
                        <div class="uppercase text-xs tracking-widest text-gray-400 mb-1">参考词</div>
                        <div class="text-3xl font-mono">${term.ref}</div>
                    </div>
                    <div class="border-l-4 border-emerald-500 pl-6">
                        <div class="uppercase text-xs tracking-widest text-gray-400 mb-1">推荐音译</div>
                        <div class="text-3xl font-semibold">${term.trans}</div>
                    </div>
                </div>
                
                <div class="mt-10 pt-8 border-t text-xs flex gap-8 text-gray-500">
                    <div>点击复制音译</div>
                </div>
            `;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // 过滤
        function filterByCategory(cat) {
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('bg-blue-50', 'dark:bg-blue-900/30'));
            
            if (cat === 'all') {
                document.getElementById('cat-all').classList.add('bg-blue-50', 'dark:bg-blue-900/30');
                renderTerms(terms);
                document.getElementById('currentCategory').textContent = '全部';
            } else {
                document.getElementById(`cat-${cat}`).classList.add('bg-blue-50', 'dark:bg-blue-900/30');
                const filtered = terms.filter(t => t.category === cat);
                renderTerms(filtered);
                document.getElementById('currentCategory').textContent = cat;
            }
        }

        function showAll() {
            filterByCategory('all');
        }

        // 搜索
        function setupSearch() {
            const input = document.getElementById('searchInput');
            input.addEventListener('input', () => {
                const query = input.value.toLowerCase().trim();
                
                if (!query) {
                    renderTerms(terms);
                    return;
                }
                
                const filtered = terms.filter(term => 
                    term.zh.toLowerCase().includes(query) ||
                    term.ref.toLowerCase().includes(query) ||
                    term.trans.toLowerCase().includes(query) ||
                    term.category.toLowerCase().includes(query)
                );
                
                renderTerms(filtered);
            });
        }

        // 导出 CSV
        function exportToCSV() {
            let csv = "序号,类别,中文,参考,音译\n";
            
            terms.forEach(t => {
                csv += `\( {t.num}," \){t.category}","\( {t.zh}"," \){t.ref}","${t.trans}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "海外安全指挥术语_100词.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 暗黑模式
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('darkMode', isDark);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (document.documentElement.classList.contains('dark')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        // 初始化
        function initialize() {
            initTailwind();
            renderCategories();
            renderTerms(terms);
            setupSearch();
            
            // 加载暗黑模式偏好
            if (localStorage.getItem('darkMode') === 'true' || 
                (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            updateThemeIcon();
            
            // 点击外部关闭弹窗
            document.getElementById('detailModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
            
            // 支持键盘 ESC
            document.addEventListener('keydown', function(e) {
                if (e.key === "Escape") {
                    const modal = document.getElementById('detailModal');
                    if (!modal.classList.contains('hidden')) closeModal();
                }
            });
            
            console.log('%c海外安全官指挥术语系统已加载 ✓', 'color: #3b82f6; font-size: 14px; font-weight: bold');
        }

        // 启动
        window.onload = initialize;
    </script>
</body>
</html>
