<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen">

        <div class="grid grid-cols-3 gap-3">

          <button onclick="setTheme(1)" class="py-4 rounded-2xl border hover:bg-gray-100">🌙 暗黑</button>
          <button onclick="setTheme(2)" class="py-4 rounded-2xl border bg-green-900 text-white">🌲 夜视</button>
        </div>
      </div>
      <div>
        <label class="block text-sm mb-3 font-medium">界面语言</label>
        <div class="flex gap-3">
          <button onclick="switchLang('zh')" class="flex-1 py-4 rounded-2xl border bg-green-100 dark:bg-green-900">中文</button>
          <button onclick="switchLang('en')" class="flex-1 py-4 rounded-2xl border">English</button>
        </div>
      </div>
      <button onclick="fakeCloudSync()" class="w-full py-5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl flex items-center justify-center gap-2">
        <i class="fas fa-cloud-upload-alt"></i> 云同步
      </button>
    </div>
    <button onclick="toggleSettings()" class="mt-8 w-full py-4 text-red-500 hover:bg-red-50 rounded-2xl">关闭</button>
  </div>

<div id="examModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100]">

      <div class="flex items-center gap-6">

      </div>
    </div>

    <div class="p-6 border-t flex gap-4">

    </div>
  </div>
</div>

<div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">

</div>
