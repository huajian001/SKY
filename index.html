<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>FSI Swahili Tactical Training System</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

<style>

:root{
  --primary:#58cc02;
  --primary2:#89e219;
  --dark:#0f172a;
  --glass:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.18);
  --danger:#ff4d6d;
  --warning:#ffb703;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:
  "Microsoft YaHei",
  system-ui,
  sans-serif;

  background:
  radial-gradient(circle at top left,#1e293b,#020617 60%);
  min-height:100vh;
  color:white;
  overflow-x:hidden;
}

/* ====== Background ====== */

.bg-grid{
  position:fixed;
  inset:0;
  background:
  linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:28px 28px;
  z-index:-1;
}

/* ====== Glass ====== */

.glass{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:
  0 8px 32px rgba(0,0,0,.35);
}

/* ===== Neo Brutalism ===== */

.neo{
  border:3px solid black;
  box-shadow:6px 6px 0px black;
}

.neo-sm{
  border:2px solid black;
  box-shadow:4px 4px 0px black;
}

.card{
  border-radius:28px;
}

.btn{
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn:active{
  transform:translateY(3px);
  box-shadow:none;
}

.title-gradient{
  background:linear-gradient(to right,#58cc02,#b7ff00);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.module-card{
  transition:.3s;
}

.module-card:hover{
  transform:translateY(-8px) scale(1.02);
}

.xp-bar{
  height:18px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,255,255,.12);
}

.xp-fill{
  height:100%;
  width:0%;
  transition:1s;
  background:linear-gradient(to right,#58cc02,#d9ff00);
}

.lesson-btn{
  transition:.25s;
}

.lesson-btn:hover{
  transform:scale(1.04);
}

.correct{
  animation:correctFlash .5s;
}

.wrong{
  animation:wrongFlash .5s;
}

@keyframes correctFlash{
  0%{background:#58cc02;}
  100%{background:transparent;}
}

@keyframes wrongFlash{
  0%{background:#ff4d6d;}
  100%{background:transparent;}
}

.pulse{
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.04);}
  100%{transform:scale(1);}
}

.answer-option{
  transition:.2s;
}

.answer-option:hover{
  transform:translateX(5px);
}

.fsibadge{
  background:linear-gradient(135deg,#58cc02,#2dd4bf);
}

.stat-box{
  background:rgba(255,255,255,.07);
}

textarea:focus,
input:focus{
  outline:none;
}

.mobile-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:50;
}

@media(max-width:768px){

  .desktop-only{
    display:none;
  }

  body{
    padding-bottom:90px;
  }
}

</style>
</head>

<body>

<div class="bg-grid"></div>

<!-- ===== Header ===== -->

<div class="max-w-7xl mx-auto p-4">

<div class="flex flex-col lg:flex-row gap-4 justify-between items-center mb-6">

<div>
<h1 class="text-4xl md:text-5xl font-black title-gradient">
FSI Swahili Tactical Training
</h1>

<p class="text-zinc-300 mt-2">
海外安全官 · 刚果金 · 战术斯瓦希里语训练系统
</p>
</div>

<div class="flex gap-3">

<button
onclick="toggleNightVision()"
class="btn neo glass px-5 py-3 rounded-2xl">
<i class="fa-solid fa-eye"></i>
</button>

<button
onclick="openFSI()"
class="btn neo fsibadge px-6 py-3 rounded-2xl font-bold">
<i class="fa-solid fa-bullseye"></i>
 FSI训练
</button>

</div>

</div>

<!-- ===== Stats ===== -->

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

<div class="glass neo-sm card p-5 stat-box">
<div class="text-zinc-400 text-sm mb-1">XP</div>
<div class="text-3xl font-black" id="xpText">0</div>
</div>

<div class="glass neo-sm card p-5 stat-box">
<div class="text-zinc-400 text-sm mb-1">连击</div>
<div class="text-3xl font-black" id="comboText">0</div>
</div>

<div class="glass neo-sm card p-5 stat-box">
<div class="text-zinc-400 text-sm mb-1">正确率</div>
<div class="text-3xl font-black" id="accuracyText">0%</div>
</div>

<div class="glass neo-sm card p-5 stat-box">
<div class="text-zinc-400 text-sm mb-1">等级</div>
<div class="text-3xl font-black" id="levelText">Lv.1</div>
</div>

</div>

<!-- ===== XP BAR ===== -->

<div class="glass neo-sm card p-3 mb-8">

<div class="flex justify-between mb-2">
<span>FSI Progress</span>
<span id="xpPercent">0%</span>
</div>

<div class="xp-bar">
<div class="xp-fill" id="xpFill"></div>
</div>

</div>

<!-- ===== Search ===== -->

<div class="glass neo card p-5 mb-8">

<div class="flex gap-3 flex-wrap">

<input
id="searchInput"
onkeyup="filterTerms()"
placeholder="搜索 中文 / 斯瓦希里语 / 音译..."
class="flex-1 min-w-[250px] px-5 py-4 rounded-2xl bg-black/20 border border-white/10 text-white"/>

<button
onclick="shuffleTerms()"
class="btn bg-yellow-400 text-black font-bold px-6 py-4 rounded-2xl neo-sm">
随机训练
</button>

<button
onclick="startQuiz()"
class="btn bg-green-500 text-black font-bold px-6 py-4 rounded-2xl neo-sm pulse">
开始FSI训练
</button>

</div>

</div>

<!-- ===== Lesson Cards ===== -->

<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-6 mb-10">

<div class="module-card glass neo card p-6">

<div class="flex justify-between items-center mb-4">

<div class="w-16 h-16 rounded-3xl bg-green-500 flex items-center justify-center text-3xl text-black">
<i class="fa-solid fa-bullhorn"></i>
</div>

<div class="text-right">
<div class="text-sm text-zinc-400">MODULE</div>
<div class="text-2xl font-black">01</div>
</div>

</div>

<h2 class="text-2xl font-black mb-3">
指挥术语
</h2>

<p class="text-zinc-300 mb-5">
海外安保 / 武装护卫 / 检查站 / 巡逻常用语
</p>

<button
onclick="loadCategory('指挥')"
class="lesson-btn w-full py-4 rounded-2xl bg-green-500 text-black font-black neo-sm">
开始训练
</button>

</div>

<div class="module-card glass neo card p-6">

<div class="flex justify-between items-center mb-4">

<div class="w-16 h-16 rounded-3xl bg-cyan-400 flex items-center justify-center text-3xl text-black">
<i class="fa-solid fa-radio"></i>
</div>

<div class="text-right">
<div class="text-sm text-zinc-400">MODULE</div>
<div class="text-2xl font-black">02</div>
</div>

</div>

<h2 class="text-2xl font-black mb-3">
无线电通信
</h2>

<p class="text-zinc-300 mb-5">
对讲机 / 车队 / 紧急通联 / 火力报告
</p>

<button
onclick="loadCategory('通信')"
class="lesson-btn w-full py-4 rounded-2xl bg-cyan-400 text-black font-black neo-sm">
开始训练
</button>

</div>

<div class="module-card glass neo card p-6">

<div class="flex justify-between items-center mb-4">

<div class="w-16 h-16 rounded-3xl bg-pink-500 flex items-center justify-center text-3xl text-black">
<i class="fa-solid fa-triangle-exclamation"></i>
</div>

<div class="text-right">
<div class="text-sm text-zinc-400">MODULE</div>
<div class="text-2xl font-black">03</div>
</div>

</div>

<h2 class="text-2xl font-black mb-3">
应急战术
</h2>

<p class="text-zinc-300 mb-5">
爆炸 / 伏击 / 紧急撤离 / 医疗术语
</p>

<button
onclick="loadCategory('应急')"
class="lesson-btn w-full py-4 rounded-2xl bg-pink-500 text-black font-black neo-sm">
开始训练
</button>

</div>

</div>

<!-- ===== Terms ===== -->

<div id="termsContainer"
class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">
</div>

</div>

<!-- ===== FSI Modal ===== -->

<div
id="quizModal"
class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl z-[100] flex items-center justify-center p-4">

<div class="glass neo card w-full max-w-2xl overflow-hidden">

<div class="p-6 border-b border-white/10">

<div class="flex justify-between items-center">

<div>
<h2 class="text-3xl font-black">
FSI Tactical Drill
</h2>
<p class="text-zinc-400 mt-1">
听说反应训练
</p>
</div>

<div class="text-right">
<div class="text-sm text-zinc-400">
题目
</div>
<div id="quizProgress" class="text-3xl font-black">
1/10
</div>
</div>

</div>

</div>

<div class="p-8">

<div class="text-center mb-8">

<div class="text-zinc-400 mb-2">
中文指令
</div>

<div id="quizQuestion"
class="text-5xl font-black mb-5">
停止
</div>

<button
onclick="speakCurrent()"
class="btn bg-green-500 text-black px-5 py-3 rounded-2xl font-bold neo-sm">
<i class="fa-solid fa-volume-high"></i>
 播放
</button>

</div>

<div id="answerArea" class="space-y-4"></div>

</div>

<div class="p-6 border-t border-white/10 flex gap-4">

<button
onclick="closeQuiz()"
class="flex-1 py-4 rounded-2xl border border-white/20">
退出
</button>

<button
onclick="nextQuestion()"
class="flex-1 py-4 rounded-2xl bg-green-500 text-black font-black neo-sm">
下一题
</button>

</div>

</div>

</div>

<!-- ===== Bottom Nav ===== -->

<div class="mobile-nav glass border-t border-white/10 p-3 md:hidden">

<div class="grid grid-cols-4 gap-3 text-center">

<button class="py-2">
<i class="fa-solid fa-house text-xl"></i>
</button>

<button onclick="startQuiz()" class="py-2">
<i class="fa-solid fa-bullseye text-xl"></i>
</button>

<button class="py-2">
<i class="fa-solid fa-fire text-xl"></i>
</button>

<button class="py-2">
<i class="fa-solid fa-user text-xl"></i>
</button>

</div>

</div>

<script>

/* =========================
   DATA
========================= */

let terms = [

{
cn:"停止",
sw:"Simama",
py:"西马马",
category:"指挥"
},

{
cn:"过来",
sw:"Kuja",
py:"库甲",
category:"指挥"
},

{
cn:"快点",
sw:"Haraka",
py:"哈拉卡",
category:"指挥"
},

{
cn:"危险",
sw:"Hatari",
py:"哈塔里",
category:"应急"
},

{
cn:"撤离",
sw:"Ondoka",
py:"翁多卡",
category:"应急"
},

{
cn:"敌人",
sw:"Adui",
py:"阿杜伊",
category:"应急"
},

{
cn:"收到",
sw:"Nimepokea",
py:"尼美波凯阿",
category:"通信"
},

{
cn:"重复",
sw:"Rudia",
py:"鲁迪亚",
category:"通信"
},

{
cn:"位置",
sw:"Mahali",
py:"马哈利",
category:"通信"
},

{
cn:"左边",
sw:"Kushoto",
py:"库修托",
category:"指挥"
},

{
cn:"右边",
sw:"Kulia",
py:"库利亚",
category:"指挥"
},

{
cn:"检查",
sw:"Kagua",
py:"卡古阿",
category:"指挥"
},

{
cn:"掩护",
sw:"Funika",
py:"富尼卡",
category:"应急"
},

{
cn:"车队",
sw:"Msafara",
py:"姆萨法拉",
category:"通信"
},

{
cn:"医疗",
sw:"Matibabu",
py:"马提巴布",
category:"应急"
}

];

/* =========================
   GLOBAL
========================= */

let xp = 0;
let combo = 0;
let correct = 0;
let total = 0;

let currentQuiz = [];
let currentIndex = 0;
let selectedAnswer = "";

/* =========================
   RENDER
========================= */

function renderTerms(data=terms){

const container =
document.getElementById("termsContainer");

container.innerHTML = "";

data.forEach(term=>{

container.innerHTML += `

<div class="glass neo card p-5">

<div class="flex justify-between items-start mb-4">

<div>

<div class="text-2xl font-black mb-2">
${term.cn}
</div>

<div class="text-green-400 text-xl font-bold">
${term.sw}
</div>

</div>

<div class="px-3 py-1 rounded-full bg-white/10 text-sm">
${term.category}
</div>

</div>

<div class="text-zinc-400 mb-5">
${term.py}
</div>

<div class="flex gap-3">

<button
onclick="speak('${term.sw}')"
class="flex-1 py-3 rounded-2xl bg-green-500 text-black font-bold neo-sm">
<i class="fa-solid fa-volume-high"></i>
</button>

<button
onclick="speak('${term.py}')"
class="flex-1 py-3 rounded-2xl bg-cyan-400 text-black font-bold neo-sm">
音译
</button>

</div>

</div>

`;

});

}

/* =========================
   SEARCH
========================= */

function filterTerms(){

const keyword =
document.getElementById("searchInput")
.value
.toLowerCase();

const filtered =
terms.filter(t=>

t.cn.includes(keyword) ||
t.sw.toLowerCase().includes(keyword) ||
t.py.includes(keyword)

);

renderTerms(filtered);

}

/* =========================
   CATEGORY
========================= */

function loadCategory(cat){

const filtered =
terms.filter(t=>t.category===cat);

renderTerms(filtered);

}

/* =========================
   RANDOM
========================= */

function shuffleTerms(){

const shuffled =
[...terms]
.sort(()=>Math.random()-0.5);

renderTerms(shuffled);

}

/* =========================
   SPEAK
========================= */

function speak(text){

if(!window.speechSynthesis) return;

const utter =
new SpeechSynthesisUtterance(text);

utter.lang = "sw";
utter.rate = 0.9;

speechSynthesis.cancel();
speechSynthesis.speak(utter);

}

/* =========================
   QUIZ
========================= */

function startQuiz(){

currentQuiz =
[...terms]
.sort(()=>Math.random()-0.5)
.slice(0,10);

currentIndex = 0;

document
.getElementById("quizModal")
.classList.remove("hidden");

showQuestion();

}

/* ========================= */

function showQuestion(){

const q =
currentQuiz[currentIndex];

selectedAnswer = "";

document
.getElementById("quizQuestion")
.innerText = q.cn;

document
.getElementById("quizProgress")
.innerText =
`${currentIndex+1}/10`;

let options =
[...terms]
.sort(()=>Math.random()-0.5)
.slice(0,3);

options.push(q);

options =
options.sort(()=>Math.random()-0.5);

const area =
document.getElementById("answerArea");

area.innerHTML = "";

options.forEach(opt=>{

area.innerHTML += `

<button
onclick="selectAnswer('${opt.sw}')"
class="answer-option w-full text-left p-5 rounded-2xl glass border border-white/10">

<div class="text-2xl font-bold">
${opt.sw}
</div>

<div class="text-zinc-400 mt-1">
${opt.py}
</div>

</button>

`;

});

}

/* ========================= */

function selectAnswer(ans){

selectedAnswer = ans;

const buttons =
document.querySelectorAll(".answer-option");

buttons.forEach(btn=>{

btn.classList.remove(
"border-green-400",
"border-red-400"
);

if(btn.innerText.includes(ans)){

btn.classList.add("border-green-400");

}

});

}

/* ========================= */

function nextQuestion(){

if(!selectedAnswer){

alert("请选择答案");
return;

}

const q =
currentQuiz[currentIndex];

total++;

if(selectedAnswer===q.sw){

correct++;
combo++;
xp += 15;

document.body.classList.add("correct");

setTimeout(()=>{
document.body.classList.remove("correct");
},300);

}else{

combo = 0;

document.body.classList.add("wrong");

setTimeout(()=>{
document.body.classList.remove("wrong");
},300);

}

updateStats();

currentIndex++;

if(currentIndex>=10){

finishQuiz();

}else{

showQuestion();

}

}

/* ========================= */

function finishQuiz(){

document.getElementById("answerArea")
.innerHTML = `

<div class="text-center py-10">

<div class="text-7xl mb-5">
🏆
</div>

<h2 class="text-4xl font-black mb-4">
FSI训练完成
</h2>

<div class="text-6xl font-black text-green-400 mb-5">
${correct*10}%
</div>

<p class="text-zinc-400 mb-8">
继续训练提升战术语言反应速度
</p>

<button
onclick="closeQuiz()"
class="px-8 py-4 bg-green-500 text-black font-black rounded-2xl neo-sm">
完成
</button>

</div>

`;

}

/* ========================= */

function closeQuiz(){

document
.getElementById("quizModal")
.classList.add("hidden");

}

/* ========================= */

function speakCurrent(){

const q =
currentQuiz[currentIndex];

speak(q.sw);

}

/* =========================
   STATS
========================= */

function updateStats(){

document
.getElementById("xpText")
.innerText = xp;

document
.getElementById("comboText")
.innerText = combo;

const acc =
total===0
?0
:Math.round(correct/total*100);

document
.getElementById("accuracyText")
.innerText = acc+"%";

const level =
Math.floor(xp/100)+1;

document
.getElementById("levelText")
.innerText = "Lv."+level;

const percent =
xp%100;

document
.getElementById("xpFill")
.style.width = percent+"%";

document
.getElementById("xpPercent")
.innerText = percent+"%";

}

/* =========================
   NIGHT VISION
========================= */

let nv = false;

function toggleNightVision(){

nv = !nv;

if(nv){

document.body.style.background =
"radial-gradient(circle at top left,#001400,#000)";

document.body.style.color =
"#00ff66";

}else{

document.body.style.background =
"radial-gradient(circle at top left,#1e293b,#020617 60%)";

document.body.style.color =
"white";

}

}

/* =========================
   INIT
========================= */

renderTerms();
updateStats();

</script>

</body>
</html>
