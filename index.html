<html lang="zh">
<head>

    .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    th, td { white-space: nowrap; }

      th, td { padding: 14px 8px; font-size: 14px; }

<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen">

<div class="max-w-7xl mx-auto p-4">
  <div class="flex justify-between items-center mb-8">

      <i class="fas fa-shield-alt"></i> 海外安全官指挥术语系统
    </h1>
    <div class="flex gap-3">
      <button onclick="startExam()" class="px-6 py-3 bg-orange-600 hover:bg-orange-700 text-white rounded-2xl flex items-center gap-2">
        <i class="fas fa-graduation-cap"></i> 开始考试
      </button>
      <button onclick="toggleSettings()" class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 text-white rounded-2xl flex items-center gap-2">
        <i class="fas fa-cog"></i>
      </button>
    </div>
  </div>

  <!-- 设置面板 -->
  <div id="settingsPanel" class="hidden fixed top-20 right-6 bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl p-6 w-80 z-50 border border-gray-200 dark:border-zinc-700">
    <h3 class="font-bold mb-6 text-lg">⚙️ 系统设置</h3>
    <div class="space-y-6">
      <div>
        <label class="block text-sm mb-3">主题模式</label>
        <div class="grid grid-cols-3 gap-3">
          <button onclick="setTheme(0)" class="py-4 rounded-2xl border hover:bg-gray-100">☀️ 亮色</button>
          <button onclick="setTheme(1)" class="py-4 rounded-2xl border hover:bg-gray-100">🌙 暗黑</button>
          <button onclick="setTheme(2)" class="py-4 rounded-2xl border bg-green-900 text-white">🌲 夜视</button>
        </div>
      </div>
      <div>
        <label class="block text-sm mb-3">界面语言</label>
        <div class="flex gap-3">
          <button onclick="switchLang('zh')" class="flex-1 py-4 rounded-2xl border">中文</button>
          <button onclick="switchLang('en')" class="flex-1 py-4 rounded-2xl border">English</button>
        </div>
      </div>
      <button onclick="fakeCloudSync()" class="w-full py-5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl">云同步（演示）</button>
    </div>
    <button onclick="toggleSettings()" class="mt-8 w-full py-4 text-red-500 hover:bg-red-50 rounded-2xl">关闭</button>
  </div>

  <!-- 工具栏 -->
  <div class="bg-white dark:bg-zinc-900 rounded-3xl shadow p-5 mb-8 flex flex-wrap gap-4 items-center">
    <input type="text" id="searchInput" placeholder="🔍 搜索 中文 / 音译 / 斯瓦希里语..." onkeyup="filterTable()" 
           class="flex-1 min-w-[280px] px-6 py-4 rounded-2xl border focus:border-green-500">
    <select id="categoryFilter" onchange="filterTable()" class="px-6 py-4 rounded-2xl border">
      <option value="">全部分类</option>
      <option value="一、指挥与身份">一、指挥与身份</option>
      <option value="二、行动指令">二、行动指令</option>
      <option value="三、战术方位">三、战术方位</option>
      <option value="四、装备与资源">四、装备与资源</option>
      <option value="五、应急与状态">五、应急与状态</option>
      <option value="六、协调与日常">六、协调与日常</option>
    </select>
    <div class="flex gap-3">
      <button onclick="showAddModal()" class="px-6 py-4 bg-green-600 hover:bg-green-700 text-white rounded-2xl flex items-center gap-2">新增</button>
      <button onclick="exportCSV()" class="px-6 py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl">导出</button>
      <button onclick="document.getElementById('importFile').click()" class="px-6 py-4 bg-purple-600 hover:bg-purple-700 text-white rounded-2xl">导入</button>
      <input type="file" id="importFile" accept=".csv" class="hidden" onchange="importCSV(event)">
    </div>
  </div>

  <!-- 表格 - 已优化移动端 -->
  <div class="bg-white dark:bg-zinc-900 rounded-3xl shadow overflow-hidden">
    <div class="table-container">
      <table class="w-full" id="dataTable">
        <thead class="bg-zinc-100 dark:bg-zinc-800">
          <tr>

            <th class="px-6 py-5 text-left">序号</th>
            <th class="px-6 py-5 text-left">中文意义</th>
            <th class="px-6 py-5 text-left">斯瓦希里语/参考</th>
            <th class="px-6 py-5 text-left">推荐音译</th>
            <th class="px-6 py-5 text-center w-28">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-gray-100 dark:divide-zinc-700"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 考试模态框 -->
<div id="examModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100]">

    <div class="p-6 border-b flex justify-between items-center">
      <h2 class="text-2xl font-bold">指挥术语考试</h2>
      <div class="flex items-center gap-6">
        <span id="examScore" class="font-bold text-2xl text-green-600">0分</span>
        <span id="examProgress" class="font-mono">1/10</span>
      </div>
    </div>
    <div class="p-10 min-h-[320px]" id="examContent"></div>
    <div class="p-6 border-t flex gap-4">
      <button onclick="exitExam()" class="flex-1 py-5 border rounded-2xl">退出</button>
      <button onclick="submitExamAnswer()" class="flex-1 py-5 bg-green-600 text-white rounded-2xl">提交答案</button>
    </div>
  </div>
</div>

<!-- 新增/编辑弹窗 -->
<div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">

      <div class="grid grid-cols-2 gap-6">

        <div><label class="block text-sm mb-2">中文意义</label><input id="cnInput" type="text" class="w-full px-6 py-4 border rounded-2xl"></div>

  </div>
</div>

// ==================== 多语言 & 主题 ====================
function switchLang(lang) {
  currentLang = lang;

}

function setTheme(theme) {
  currentTheme = theme;
  document.body.classList.remove('dark', 'night-vision', 'matrix-bg');
  if (theme === 1) document.body.classList.add('dark');
  if (theme === 2) document.body.classList.add('night-vision', 'matrix-bg');
}

function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('hidden');

      <td class="px-6 py-5 font-medium text-green-600 dark:text-green-400">${item.py}</td>
      <td class="px-6 py-5 text-center">
        <button onclick="editTerm(${item.id})" class="text-blue-500 hover:text-blue-600 mx-2"><i class="fas fa-edit"></i></button>
        <button onclick="deleteTerm(${item.id})" class="text-red-500 hover:text-red-600 mx-2"><i class="fas fa-trash"></i></button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function filterTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const category = document.getElementById('categoryFilter').value;
  let filtered = terms;
  if (category) filtered = filtered.filter(t => t.cat === category);
  if (search) {
    filtered = filtered.filter(t => 
      (t.cn && t.cn.toLowerCase().includes(search)) || 
      (t.sw && t.sw.toLowerCase().includes(search)) || 
      (t.py && t.py.toLowerCase().includes(search))
    );
  }
  renderTable(filtered);
}

// ==================== CRUD ====================
function showAddModal() {
  document.getElementById('modalTitle').textContent = '新增术语';
  document.getElementById('editId').value = '';
  document.getElementById('catInput').value = '';
  document.getElementById('numInput').value = '';
  document.getElementById('cnInput').value = '';
  document.getElementById('swInput').value = '';
  document.getElementById('pyInput').value = '';
  document.getElementById('modal').classList.remove('hidden');
}

function editTerm(id) {
  const term = terms.find(t => t.id === id);
  if (!term) return;
  document.getElementById('modalTitle').textContent = '编辑术语';
  document.getElementById('editId').value = term.id;
  document.getElementById('catInput').value = term.cat;
  document.getElementById('numInput').value = term.num;
  document.getElementById('cnInput').value = term.cn;
  document.getElementById('swInput').value = term.sw;
  document.getElementById('pyInput').value = term.py;
  document.getElementById('modal').classList.remove('hidden');
}

function saveTerm() {
  const id = document.getElementById('editId').value;
  const newTerm = {
    id: id ? parseInt(id) : Date.now(),
    cat: document.getElementById('catInput').value,
    num: parseInt(document.getElementById('numInput').value) || 0,
    cn: document.getElementById('cnInput').value,
    sw: document.getElementById('swInput').value,
    py: document.getElementById('pyInput').value
  };
  if (id) {
    const index = terms.findIndex(t => t.id === parseInt(id));
    if (index > -1) terms[index] = newTerm;
  } else {
    terms.push(newTerm);
  }
  saveToLocal();
  closeModal();
  filterTable();
}

function deleteTerm(id) {
  if (confirm('确定删除此记录？')) {
    terms = terms.filter(t => t.id !== id);
    saveToLocal();
    filterTable();
  }
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

// ==================== 存储 & CSV ====================
function saveToLocal() {
  localStorage.setItem('security_terms_v2', JSON.stringify(terms));
}

function loadFromLocal() {
  const saved = localStorage.getItem('security_terms_v2');
  if (saved) terms = JSON.parse(saved);
  renderTable(terms);
}

function exportCSV() {
  let csv = "类别,序号,中文意义,斯瓦希里语/参考词,推荐音译\n";
  terms.forEach(t => {
    csv += `"\( {t.cat}", \){t.num},"\( {t.cn}"," \){t.sw}","${t.py}"\n`;
  });
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '安全指挥术语.csv';
  a.click();
}

function importCSV(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const rows = ev.target.result.split('\n');
    rows.slice(1).forEach(row => {
      if (!row.trim()) return;
      const cols = row.split(',').map(c => c.replace(/"/g,'').trim());
      if (cols.length >= 5) {
        terms.push({
          id: Date.now(),
          cat: cols[0],
          num: parseInt(cols[1]) || 0,
          cn: cols[2],
          sw: cols[3],
          py: cols[4]
        });
      }
    });
    saveToLocal();
    filterTable();
    alert('✅ 导入成功！');
  };
  reader.readAsText(file);
}

// ==================== 考试 ====================
function startExam() {
  examQuestions = [...terms].sort(() => Math.random() - 0.5).slice(0, 10);
  currentExamIndex = 0;
  examScore = 0;
  document.getElementById('examModal').classList.remove('hidden');
  showExamQuestion();
}

function showExamQuestion() {
  const q = examQuestions[currentExamIndex];
  document.getElementById('examContent').innerHTML = `
    <div class="text-xl font-medium mb-8">${q.cn}</div>
    <input type="text" id="examAnswer" placeholder="输入推荐音译" class="w-full px-6 py-5 border rounded-2xl text-lg focus:border-green-500" autofocus>
  `;
  document.getElementById('examProgress').textContent = `${currentExamIndex+1}/10`;
  document.getElementById('examScore').textContent = `${examScore}分`;
}

function submitExamAnswer() {
  const answer = (document.getElementById('examAnswer') || {}).value || '';
  if (!answer.trim()) {
    alert('请输入答案');
    return;
  }
  const correct = examQuestions[currentExamIndex].py;
  if (answer.toLowerCase() === correct.toLowerCase()) examScore += 10;
  currentExamIndex++;
  if (currentExamIndex >= 10) {
    showExamResult();
  } else {
    showExamQuestion();
  }
}

function showExamResult() {
  document.getElementById('examContent').innerHTML = `
    <div class="text-center py-12">
      <h2 class="text-4xl font-bold mb-4">考试结束</h2>
      <p class="text-7xl font-bold text-green-600 mb-6">${examScore}分</p>
      <button onclick="restartExam()" class="px-10 py-4 bg-green-600 text-white rounded-2xl text-lg">重新考试</button>
    </div>
  `;
}

function restartExam() {
  document.getElementById('examModal').classList.add('hidden');
  startExam();
}

function exitExam() {
  if (confirm('确定退出考试吗？')) document.getElementById('examModal').classList.add('hidden');
}

// ==================== 初始化 ====================
loadFromLocal();
setTheme(0);
</script>
</body>
</html>
