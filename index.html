            { id: 87, cat: "五、应急与状态", zh: "没问题/好", swa: "Sawa", py: "萨瓦" },
            { id: 88, cat: "五、应急与状态", zh: "不行", swa: "Hapana", py: "哈巴拿" },
            { id: 89, cat: "五、应急与状态", zh: "结束/完成", swa: "Finish", py: "费内什" },
            { id: 90, cat: "五、应急与状态", zh: "明白吗", swa: "Elewa", py: "艾类瓦" },
            { id: 91, cat: "六、协调与日常", zh: "现在", swa: "Sasa", py: "萨萨" },
            { id: 92, cat: "六、协调与日常", zh: "今天", swa: "Leo", py: "勒奥" },
            { id: 93, cat: "六、协调与日常", zh: "明天", swa: "Gexiu", py: "给休" },
            { id: 94, cat: "六、协调与日常", zh: "昨天", swa: "Jana", py: "加纳" },
            { id: 95, cat: "六、协调与日常", zh: "晚上", swa: "Musigu", py: "木西古" },
            { id: 96, cat: "六、协调与日常", zh: "很多", swa: "Minge", py: "民给" },
            { id: 97, cat: "六、协调与日常", zh: "很少", swa: "Kilogo", py: "齐洛哥" },
            { id: 98, cat: "六、协调与日常", zh: "谢谢", swa: "Asante", py: "阿桑特" },
            { id: 99, cat: "六、协调与日常", zh: "你好", swa: "Jambo", py: "江波" },
            { id: 100, cat: "六、协调与日常", zh: "看看/检查", swa: "Angalia", py: "安格利亚" }
        ];

        let words = JSON.parse(localStorage.getItem('tactical_words_v3')) || defaultWords;
        let currentCat = '全部 (100)', searchInput = '';
        const tagStyles = { "一、指挥与身份": "bg-blue-900/30 text-blue-400 border-blue-800/60", "二、行动指令": "bg-red-900/30 text-red-400 border-red-800/60", "三、战术方位": "bg-amber-900/30 text-amber-400 border-amber-800/60", "四、装备与资源": "bg-purple-900/30 text-purple-400 border-purple-800/60", "五、应急与状态": "bg-pink-900/30 text-pink-400 border-pink-800/60", "六、协调与日常": "bg-teal-900/30 text-teal-400 border-teal-800/60" };

        function renderTabs() {
            const categories = ['全部 (100)', '一、指挥与身份', '二、行动指令', '三、战术方位', '四、装备与资源', '五、应急与状态', '六、协调与日常'];
            document.getElementById('categoryTabs').innerHTML = categories.map(cat => `<button onclick="filterCat('${cat}')" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-800 bg-slate-900 text-slate-400 ${currentCat === cat ? 'tab-active' : ''}">${cat}</button>`).join('');
        }

        function renderList(data = words) {
            let filtered = currentCat === '全部 (100)' ? data : data.filter(w => w.cat === currentCat);
            if (searchInput) filtered = filtered.filter(w => w.zh.includes(searchInput) || w.swa.toLowerCase().includes(searchInput.toLowerCase()) || w.py.includes(searchInput));
            document.getElementById('resultCount').innerText = filtered.length;
            document.getElementById('wordContainer').innerHTML = filtered.map(w => `
                <div class="bg-slate-900/80 border border-slate-800/80 p-4 rounded-2xl flex items-center justify-between tactical-card">
                    <div class="flex items-center space-x-4 min-w-0 flex-1">
                        <span class="text-xs font-mono text-slate-600 w-6">#${w.id}</span>
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="text-[9px] px-1.5 py-0.5 rounded font-bold border ${tagStyles[w.cat] || ''}">${w.cat.split('、')[1]}</span>
                                <span class="text-sm font-bold text-slate-100 highlight-text truncate">${w.zh}</span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-emerald-400 font-mono font-bold text-base tracking-wide flex items-center">${w.swa}
                                    <button onclick="event.stopPropagation(); speak('${w.swa}')" class="ml-2 text-slate-500 hover:text-emerald-400 p-1"><i class="fa-solid fa-volume-high text-xs"></i></button>
                                </span>
                                <span class="text-[10px] text-amber-500 font-medium">音译：${w.py}</span>
                            </div>
                        </div>
                    </div>
                    <button onclick="triggerFlashScreen('${w.zh}', '${w.swa}', '${w.py}')" class="w-10 h-10 rounded-full border border-slate-800 flex items-center justify-center text-slate-500 active:scale-95 ml-2"><i class="fa-solid fa-expand text-xs"></i></button>
                </div>`).join('');
        }

        function filterCat(cat) { currentCat = cat; renderTabs(); renderList(); }
        function filterWords() { searchInput = document.getElementById('searchInput').value; renderList(); }
        function speak(text) { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); const msg = new SpeechSynthesisUtterance(text); msg.lang = 'fr-FR'; msg.rate = 0.85; window.speechSynthesis.speak(msg); } }
        function showAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function hideAddModal() { document.getElementById('addModal').classList.add('hidden'); }

        function saveNewWord() {
            const cat = document.getElementById('newCat').value, zh = document.getElementById('newZh').value, swa = document.getElementById('newSwa').value, py = document.getElementById('newPinyin').value;
            if(!zh || !swa || !py) return showAlert("请填写所有字段");
            words.unshift({ id: words.length + 1, cat, zh, swa, py });
            localStorage.setItem('tactical_words_v3', JSON.stringify(words));
            renderList(); hideAddModal(); showAlert("持久化录入成功");
            document.getElementById('newZh').value = ''; document.getElementById('newSwa').value = ''; document.getElementById('newPinyin').value = '';
        }

        function triggerFlashScreen(zh, swa, pinyin) { document.getElementById('flashZh').innerText = zh; document.getElementById('flashSwa').innerText = swa; document.getElementById('flashPinyin').innerText = pinyin; const m = document.getElementById('flashModal'); m.classList.remove('hidden'); m.classList.add('flex'); speak(swa); }
        function closeFlashScreen() { document.getElementById('flashModal').classList.add('hidden'); }
        
        let nv = false;
        function toggleNightVision() { nv = !nv; document.body.classList.toggle('night-vision', nv); document.getElementById('headerNav').classList.toggle('night-vision', nv); showAlert(nv ? "夜视红光开启" : "夜视模式关闭"); }
        function showAlert(msg) { const b = document.getElementById('alertBox'); document.getElementById('alertMessage').innerText = msg; b.classList.remove('opacity-0', 'pointer-events-none'); b.classList.add('opacity-100'); setTimeout(() => { b.classList.remove('opacity-100'); b.classList.add('opacity-0', 'pointer-events-none'); }, 2000); }

        function exportExcel() {
            let csv = "\uFEFF大类,序号,中文意义,外文参考,拟音\n";
            words.forEach(w => csv += `"${w.cat}","${w.id}","${w.zh}","${w.swa}","${w.py}"\n`);
            const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); link.download = `指挥100词_${new Date().getTime()}.csv`; link.click();
        }

        let qQ = [], qI = 0, qS = 0, sO = null;
        function openQuiz() { qQ = [...words].sort(() => 0.5 - Math.random()).slice(0, 10); qI = 0; qS = 0; document.getElementById('quizModal').classList.remove('hidden'); loadQuizQuestion(); }
        function closeQuiz() { document.getElementById('quizModal').classList.add('hidden'); }
        function loadQuizQuestion() {
            sO = null; const nB = document.getElementById('quizNextBtn'); nB.disabled = true; nB.className = "w-full py-3.5 rounded-xl bg-slate-850 text-slate-600 text-xs font-bold"; nB.innerText = "请选择正确答案";
            const q = qQ[qI]; document.getElementById('quizProgress').innerText = `${qI + 1} / 10`; document.getElementById('quizScore').innerText = qS; document.getElementById('quizQuestionWord').innerText = q.swa; document.getElementById('quizQuestionPinyin').innerText = q.py;
            let opts = [q, ...words.filter(w => w.id !== q.id).sort(() => 0.5 - Math.random()).slice(0, 3)].sort(() => 0.5 - Math.random());
            document.getElementById('quizOptionsContainer').innerHTML = opts.map((o, i) => `<button onclick="selQuizOpt(${i}, ${o.id === q.id})" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-800 text-left text-xs font-semibold quiz-opt-btn flex justify-between items-center"><span>${i + 1}. ${o.zh}</span><span class="text-[9px] text-slate-500">${o.cat.split('、')[1]}</span></button>`).join('');
            speak(q.swa);
        }
        function selQuizOpt(idx, isC) {
            if (sO !== null) return; sO = idx;
            const btns = document.querySelectorAll('.quiz-opt-btn');
            btns.forEach((b, i) => { if(i === idx) { if(isC) { b.className = "w-full p-4 rounded-xl bg-emerald-950/80 border-2 border-emerald-500 text-emerald-400 text-left text-xs font-bold flex justify-between items-center"; b.innerHTML += `<i class="fa-solid fa-circle-check"></i>`; qS += 10; } else { b.className = "w-full p-4 rounded-xl bg-red-950/80 border-2 border-red-500 text-red-400 text-left text-xs font-bold flex justify-between items-center"; b.innerHTML += `<i class="fa-solid fa-circle-xmark"></i>`; } } else { b.classList.add('opacity-40'); } });
            const nB = document.getElementById('quizNextBtn'); nB.disabled = false; nB.className = "w-full py-3.5 rounded-xl bg-cyan-600 text-white text-xs font-bold shadow-lg"; nB.innerText = qI === 9 ? "完成测试" : "下一题";
        }
        function nextQuiz() { if (qI < 9) { qI++; loadQuizQuestion(); } else { document.getElementById('quizOptionsContainer').innerHTML = `<div class="text-center py-8 space-y-2"><div class="text-5xl font-black text-amber-400">${qS} <span class="text-xs">分</span></div><div class="text-sm font-bold">评级：<span class="text-cyan-400">${qS >= 90 ? "优秀指挥官" : qS >= 70 ? "合格指战员" : "仍需练习"}</span></div></div>`; const nB = document.getElementById('quizNextBtn'); nB.innerText = "重新测试"; nB.onclick = () => { nB.onclick = nextQuiz; openQuiz(); }; } }

        window.onload = () => { renderTabs(); renderList(); if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); };
    </script>
</body>
</html>
