    .night-vision { 
      background-color: #031403 !important; 
      color: #00ff41 !important; 
    }
    .night-vision input, .night-vision select, .night-vision textarea { 
      background-color: #052005 !important; 
      color: #00ff41 !important;

    }
    .night-vision button {
      background-color: #082d08 !important;
      color: #00ff41 !important;
      border: 1px solid #00ff41 !important;
    }
    .night-vision button:hover {
      background-color: #00ff41 !important;
      color: #031403 !important;
    }
    .night-vision .card {
      background-color: #052005 !important;
      border: 1px solid #004410 !important;
    }
    .night-vision .category-header {
      background-color: #0a330a !important;
      color: #00ff41 !important;
      border-left: 4px solid #00ff41;
    }
    
    /* 常规暗黑模式微调 */
    .dark .card {
      background-color: #18181b;
      border: 1px solid #27272a;
    }
    .dark .category-header {
      background-color: #27272a;
      color: #e4e4e7;

    }

    .category-header {
      background-color: #f4f4f5;
      color: #27272a;
      border-left: 4px solid #15803d;
    }

      background-image: linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px); 
      background-size: 20px 20px; 
    }
    
    /* 移除任何横向滚动的最小宽度限制，100% 容器自适应 */
    .table-container { 
      overflow-x: hidden; 
    }
    table { 
      width: 100% !important;
      table-layout: fixed;
    }
    
    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }

      background: #4b5563;

    // ==================== 提示系统 ====================
    function showToast(message, type = "success") {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `p-3 rounded-xl shadow-xl flex items-center gap-1.5 border bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 text-xs font-semibold transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto`;
      
      let icon = '<i class="fas fa-check-circle text-green-500"></i>';
      if (type === 'error') {
        icon = '<i class="fas fa-exclamation-circle text-red-500"></i>';
        toast.classList.add('border-red-100', 'dark:border-red-950');
      } else if (type === 'info') {
        icon = '<i class="fas fa-info-circle text-blue-500"></i>';
      }
      
      toast.innerHTML = `${icon} <span>${message}</span>`;
      container.appendChild(toast);
      
      // Animate entry
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);
      
      // Remove toast
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-10px]');
        setTimeout(() => {
          toast.remove();
        }, 300);
      }, 3000);
    }

    // 自定义确认弹窗
    function showConfirm(title, message, onOk) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      modal.classList.remove('hidden');

      const cleanUp = () => {
        modal.classList.add('hidden');
        document.getElementById('confirmOkBtn').removeEventListener('click', handleOk);
        document.getElementById('confirmCancelBtn').removeEventListener('click', handleCancel);
      };

      const handleOk = () => { onOk(); cleanUp(); };
      const handleCancel = () => { cleanUp(); };

      document.getElementById('confirmOkBtn').addEventListener('click', handleOk);
      document.getElementById('confirmCancelBtn').addEventListener('click', handleCancel);
    }

    // ==================== 渲染引擎 (极窄间距自适应，拒绝滑动) ====================
    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      const noDataView = document.getElementById('noDataView');
      tbody.innerHTML = '';

      if (data.length === 0) {
        noDataView.classList.remove('hidden');
        return;
      }
      noDataView.classList.add('hidden');

      // 统一按照 num 升序（1 - 100）排列
      const sorted = [...data].sort((a, b) => a.num - b.num);

      let currentCategory = '';
      const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();

      sorted.forEach(item => {
        // 分类标头 (小单元格 padding)
        if (item.cat !== currentCategory) {
          const header = document.createElement('tr');
          header.className = 'category-header border-y dark:border-zinc-800 transition-all duration-200';
          header.innerHTML = `<td colspan="5" class="px-2 py-2 text-[10px] sm:text-xs font-extrabold uppercase tracking-wider">${item.cat}</td>`;
          tbody.appendChild(header);
          currentCategory = item.cat;
        }

        // 高亮检索词
        let highlightedCn = highlightText(item.cn, searchValue);
        let highlightedSw = highlightText(item.sw, searchValue);
        let highlightedPy = highlightText(item.py, searchValue);

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-green-50/40 dark:hover:bg-zinc-800/40 border-b border-zinc-100 dark:border-zinc-800/40 transition-colors duration-150';
        tr.innerHTML = `
          <td class="px-1.5 py-2 text-center font-mono font-bold text-zinc-400 dark:text-zinc-600 text-[10px] sm:text-xs">${item.num}</td>
          <td class="px-1.5 py-2 font-medium break-all text-[11px] sm:text-xs">${highlightedCn}</td>
          <td class="px-1.5 py-2 font-sans break-all text-[11px] sm:text-xs">${highlightedSw}</td>
          <td class="px-1.5 py-2 font-semibold text-green-700 dark:text-green-400 break-all text-[11px] sm:text-xs">${highlightedPy}</td>
          <td class="px-1.5 py-2 text-center">
            <div class="flex items-center justify-center gap-0.5">
              <button onclick="editTerm(${item.id})" class="p-1 text-indigo-500 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-zinc-800 rounded transition-all" title="修改">
                <i class="fas fa-edit text-[10px] sm:text-xs"></i>
              </button>
              <button onclick="deleteTerm(${item.id})" class="p-1 text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-zinc-800 rounded transition-all" title="删除">
                <i class="fas fa-trash-can text-[10px] sm:text-xs"></i>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 搜索高亮辅助函数
    function highlightText(text, search) {
      if (!search) return text;
      const strText = String(text);
      const index = strText.toLowerCase().indexOf(search);
      if (index >= 0) {
        return strText.substring(0, index) + 
               `<mark class="bg-yellow-200 dark:bg-yellow-900/60 dark:text-yellow-100 rounded-sm px-0.5">${strText.substring(index, index + search.length)}</mark>` + 
               strText.substring(index + search.length);
      }
      return text;
    }

    // 分类和搜索混合过滤
    function filterTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;
      let filtered = terms;
      if (category) filtered = filtered.filter(t => t.cat === category);
      if (search) {
        filtered = filtered.filter(t =>
          String(t.cn).toLowerCase().includes(search) ||
          String(t.sw).toLowerCase().includes(search) ||
          String(t.py).toLowerCase().includes(search)
        );
      }
      renderTable(filtered);
    }

      document.getElementById('editId').value = '';

    function editTerm(id) {
      const term = terms.find(t => t.id === id);
      if (!term) return;
      document.getElementById('modalTitle').textContent = currentLang === 'zh' ? '编辑术语' : 'Edit Term';
      document.getElementById('editId').value = term.id;
      document.getElementById('catInput').value = term.cat;
      document.getElementById('numInput').value = term.num;
      document.getElementById('cnInput').value = term.cn;
      document.getElementById('swInput').value = term.sw;
      document.getElementById('pyInput').value = term.py;
      document.getElementById('modal').classList.remove('hidden');
    }

    function saveTerm() {
      const id = document.getElementById('editId').value;
      const newTerm = {
        id: id ? parseInt(id) : Date.now(),
        cat: document.getElementById('catInput').value,
        num: parseInt(document.getElementById('numInput').value) || 0,
        cn: document.getElementById('cnInput').value.trim(),
        sw: document.getElementById('swInput').value.trim(),
        py: document.getElementById('pyInput').value.trim()
      };

      if (!newTerm.cn || !newTerm.sw || !newTerm.py) {
        showToast(currentLang === 'zh' ? '❌ 所有信息均必填！' : 'All fields required', 'error');
        return;
      }

      if (id) {
        const index = terms.findIndex(t => t.id === parseInt(id));
        if (index > -1) terms[index] = newTerm;
      } else {
        terms.push(newTerm);
      }

      saveToLocal();
      closeModal();
      filterTable();
      showToast(I18N[currentLang].toastSave, 'success');
    }

    function deleteTerm(id) {
      showConfirm(
        currentLang === 'zh' ? '删除确认' : 'Delete Confirm',
        I18N[currentLang].confirmDelete,
        () => {
          terms = terms.filter(t => t.id !== id);
          saveToLocal();
          filterTable();
          showToast(I18N[currentLang].toastDelete, 'info');
        }
      );
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    // ==================== CSV 数据备份及导入 ====================
    function saveToLocal() {
      localStorage.setItem('security_terms_v3', JSON.stringify(terms));

    function loadFromLocal() {
      const saved = localStorage.getItem('security_terms_v3');
      if (saved) {
        terms = JSON.parse(saved);
      } else {
        terms = [...DEFAULT_TERMS];
      }
      renderTable(terms);
    }

        () => {
          terms = [...DEFAULT_TERMS];
          saveToLocal();
          filterTable();
          showToast(I18N[currentLang].toastRestore, 'success');
        }
      );

    function exportCSV() {
      let csvContent = "\ufeff类别,序号,中文意义,斯瓦希里语,推荐音译\r\n";
      terms.forEach(t => {
        csvContent += `"${t.cat}",${t.num},"${t.cn}","${t.sw}","${t.py}"\r\n`;
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `海外安全官指挥术语库_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    function importCSV(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const lines = ev.target.result.split(/\r?\n/);
          let newCount = 0;
          lines.slice(1).forEach(row => {
            if (!row.trim()) return;
            const cols = row.split(',').map(c => c.replace(/^["']|["']$/g, '').trim());
            if (cols.length >= 5) {
              terms.push({
                id: Date.now() + Math.random(),
                cat: cols[0],
                num: parseInt(cols[1]) || (terms.length + 1),
                cn: cols[2],
                sw: cols[3],
                py: cols[4]
              });
              newCount++;
            }
          });
          if (newCount > 0) {
            saveToLocal();
            filterTable();
            showToast(`${I18N[currentLang].toastImport} (${newCount})`, 'success');
          } else {
            showToast('未发现有效的指挥术语格式', 'error');
          }
        } catch (err) {
          showToast('导入失败，请检查CSV格式！', 'error');
        }
      };
      reader.readAsText(file);
    }

      document.getElementById('examContent').innerHTML = `
        <div class="text-[10px] font-bold text-zinc-400 dark:text-zinc-500 mb-1 tracking-widest uppercase">${q.cat}</div>
        <div class="text-xl font-black text-zinc-800 dark:text-zinc-100 mb-4 flex items-center gap-1.5">
          <i class="fas fa-quote-left text-zinc-300"></i> ${q.cn} <i class="fas fa-quote-right text-zinc-300"></i>
        </div>
        <div class="text-xs text-zinc-500 mb-3 font-semibold">斯瓦希里语: <span class="text-indigo-600 dark:text-indigo-400 text-sm ml-1 font-bold">${q.sw}</span></div>
        <div class="relative">
          <input type="text" id="examAnswer" placeholder="${I18N[currentLang].examEnterAns}" 
                 class="w-full px-4 py-3 border border-zinc-200 dark:border-zinc-800 dark:bg-zinc-950 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-500 transition-all font-semibold" 
                 onkeydown="if(event.key==='Enter') submitExamAnswer()" autofocus>
        </div>
      `;
      document.getElementById('examProgress').textContent = `${currentExamIndex + 1} / 10`;
      document.getElementById('examScore').textContent = `${examScore} 分`;
      setTimeout(() => {
        const el = document.getElementById('examAnswer');
        if(el) el.focus();
      }, 100);
    }

    // 提交答案
    function submitExamAnswer() {
      const answerInput = document.getElementById('examAnswer');
      if (!answerInput) return;
      
      const answer = answerInput.value.trim();
      if (!answer) {
        showToast('请输入答案', 'error');
        return;
      }

      const q = examQuestions[currentExamIndex];
      const isCorrect = answer.toLowerCase() === q.py.toLowerCase();
      
      const examContent = document.getElementById('examContent');
      const nextBtn = document.getElementById('examActionBtn');

      if (isCorrect) {
        examScore += 10;
        examContent.innerHTML = `
          <div class="text-center py-4">
            <div class="w-12 h-12 bg-green-100 dark:bg-green-950 text-green-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-3 animate-bounce">
              <i class="fas fa-check"></i>
            </div>
            <p class="text-lg font-bold text-green-600">${I18N[currentLang].examCorrect}</p>
            <p class="text-xs text-zinc-500 mt-1">${q.cn} ➜ <span class="font-bold text-green-600">${q.py}</span></p>
          </div>
        `;
      } else {
        examContent.innerHTML = `
          <div class="text-center py-4">
            <div class="w-12 h-12 bg-red-100 dark:bg-red-950 text-red-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-3 animate-pulse">
              <i class="fas fa-times"></i>
            </div>
            <p class="text-base font-bold text-red-500">${I18N[currentLang].examIncorrect}</p>
            <p class="text-sm font-black text-green-600 dark:text-green-400 mt-1">${q.py}</p>
            <p class="text-[10px] text-zinc-400 mt-1">您输入的回答: <span class="line-through text-red-400">${answer}</span></p>
          </div>
        `;
      }

      document.getElementById('examScore').textContent = `${examScore} 分`;
      currentExamIndex++;

      // 修改下一题按钮
      nextBtn.innerHTML = `<span>${currentExamIndex >= 10 ? '查看结果' : '下一题'} <i class="fas fa-arrow-right"></i></span>`;
      nextBtn.className = "flex-1 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg text-xs font-semibold transition-all";
      nextBtn.onclick = currentExamIndex >= 10 ? showExamResult : showExamQuestion;
    }

    function showExamResult() {
      const isExcellent = examScore >= 80;
      const statusIcon = isExcellent ? '🏆' : '👮';
      const statusText = isExcellent ? '特级海外安全官勋章' : '需进一步强化学习';

      document.getElementById('examContent').innerHTML = `
        <div class="text-center py-2">
          <div class="text-4xl mb-3">${statusIcon}</div>
          <h2 class="text-sm font-black mb-1">${I18N[currentLang].examSuccess}</h2>
          <p class="text-zinc-400 text-[10px] mb-3">${statusText}</p>
          <div class="inline-block px-6 py-3 bg-zinc-100 dark:bg-zinc-800 rounded-2xl mb-2">
            <span class="text-zinc-500 text-[9px] uppercase tracking-wider block">最终得分</span>
            <span class="text-3xl font-black text-green-600">${examScore}分</span>
          </div>
        </div>
      `;
      const actBtn = document.getElementById('examActionBtn');
      actBtn.onclick = startExam;
      actBtn.innerHTML = `<i class="fas fa-rotate text-xs"></i> <span>${I18N[currentLang].reExam}</span>`;
      actBtn.className = "flex-1 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-xs font-semibold transition-all";
    }

    function exitExam() {
      showConfirm(
        currentLang === 'zh' ? '退出考核' : 'Exit Exam',
        currentLang === 'zh' ? '确定要退出当前考核吗？答题进度不会被保存。' : 'Are you sure you want to exit? Your progress will be lost.',
        () => {
          document.getElementById('examModal').classList.add('hidden');
        }
      );
    }

    // ==================== 多主题控制 ====================
    function setTheme(theme) {
      currentTheme = theme;
      document.body.classList.remove('dark', 'night-vision', 'matrix-bg');
      
      // 重置所有主题按钮选中状态
      for (let i = 0; i <= 2; i++) {
        document.getElementById(`themeBtn${i}`).className = "py-2 text-[11px] rounded-lg border dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800 font-medium hover:border-green-500 transition-all";
      }

      const activeBtn = document.getElementById(`themeBtn${theme}`);
      if (theme === 0) {
        activeBtn.classList.add('border-green-600', 'text-green-600', 'bg-green-50/50');
      } else if (theme === 1) {
        document.body.classList.add('dark');
        activeBtn.classList.add('border-zinc-400', 'text-white', 'bg-zinc-700');
      } else if (theme === 2) {
        document.body.classList.add('night-vision', 'matrix-bg');
        activeBtn.classList.add('border-green-500', 'text-green-400', 'bg-green-950');
      }
    }

    // 开关设置面板
    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('hidden');
    }

    function fakeCloudSync() {
      exportCSV();
      showToast(currentLang === 'zh' ? '✅ 云端备份：CSV格式术语库已成功导出并下载至您的设备' : 'Cloud sync completed', 'success');
    }

    // ==================== 语言切换 ====================
    function switchLang(lang) {
      currentLang = lang;
      
      // 更新设置界面的高亮
      document.getElementById('langBtnZh').className = `py-1.5 text-xs rounded-lg border dark:border-zinc-800 hover:border-green-500 transition-all ${lang === 'zh' ? 'bg-green-600 text-white border-green-600' : ''}`;
      document.getElementById('langBtnEn').className = `py-1.5 text-xs rounded-lg border dark:border-zinc-800 hover:border-green-500 transition-all ${lang === 'en' ? 'bg-green-600 text-white border-green-600' : ''}`;

      // 文本替换
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[lang] && I18N[lang][key]) {
          el.textContent = I18N[lang][key];
        }
      });

      // 占位符替换
      document.getElementById('searchInput').placeholder = I18N[lang].searchPlaceholder;
      
      showToast(I18N[lang].toastSelectLang, 'info');
      filterTable();
    }

    // ==================== 系统加载 ====================
    window.onload = function() {
      loadFromLocal();
      setTheme(0);
      switchLang('zh');
    };
  </script>
</body>
</html>
