<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>江湖法语速成 · 学习软件</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --card-hover: #243044;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --accent: #22d3ee;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
      --shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 16px 80px;
    }
    header {
      text-align: center;
      padding: 20px 0 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header .sub {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    header .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 10px;
      font-size: 0.75rem;
      background: rgba(59,130,246,0.2);
      color: #93c5fd;
      border-radius: 999px;
    }

    /* Nav */
    nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0 16px;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    nav button {
      flex: 0 0 auto;
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-muted);
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    nav button.active, nav button:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    /* Stats bar */
    .stats {
      display: flex;
      justify-content: space-around;
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .stat { text-align: center; }
    .stat .num { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .stat .label { font-size: 0.75rem; color: var(--text-muted); }

    /* Card mode */
    .flash-card {
      background: var(--card);
      border-radius: 20px;
      padding: 36px 24px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
      transition: transform 0.3s;
    }
    .flash-card .category {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(34,211,238,0.12);
      padding: 2px 10px;
      border-radius: 999px;
    }
    .flash-card .cn {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
    }
    .flash-card .fr {
      font-size: 1.8rem;
      color: #60a5fa;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }
    .flash-card .py {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-align: center;
    }
    .flash-card .hint {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 8px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button.btn {
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-accent { background: #0891b2; color: white; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-ghost:hover { background: var(--card-hover); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Quiz */
    .quiz-question {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      margin: 24px 0 20px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option {
      padding: 14px 18px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .option:hover { border-color: var(--primary); background: var(--card-hover); }
    .option.correct { border-color: var(--success); background: rgba(34,197,94,0.15); }
    .option.wrong { border-color: var(--danger); background: rgba(239,68,68,0.15); }
    .option.disabled { pointer-events: none; }

    /* List */
    .search-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 12px;
      padding-bottom: 4px;
    }
    .filter-row button {
      flex: 0 0 auto;
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-muted);
      cursor: pointer;
    }
    .filter-row button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .word-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .word-item {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .word-item .left { flex: 1; min-width: 0; }
    .word-item .cn { font-weight: 600; font-size: 1.05rem; }
    .word-item .fr { color: #60a5fa; font-size: 0.95rem; }
    .word-item .py { color: var(--text-muted); font-size: 0.85rem; }
    .word-item .speak-btn {
      background: rgba(59,130,246,0.2);
      border: none;
      color: #93c5fd;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* About */
    .about {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
      line-height: 1.7;
    }
    .about h2 { margin-bottom: 12px; color: var(--accent); }
    .about p { margin-bottom: 10px; color: var(--text-muted); }
    .about ul { padding-left: 20px; color: var(--text-muted); }
    .about li { margin-bottom: 6px; }

    /* Progress */
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.3s;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .score-banner {
      text-align: center;
      padding: 16px;
      background: var(--card);
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .score-banner .big { font-size: 2rem; font-weight: 700; color: var(--accent); }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15,20,25,0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>

      { cn: "盐", fr: "sel", py: "塞乐", cat: "食物人物" },
      { cn: "胡椒", fr: "poivre", py: "布哇伍赫", cat: "食物人物" },
      { cn: "酱油", fr: "sauce de soja", py: "缩司德缩热啊", cat: "食物人物" },
      { cn: "醋", fr: "vinaigre", py: "维内阁赫", cat: "食物人物" },
      { cn: "鸡蛋", fr: "œuf", py: "俄刷", cat: "食物人物" },
      { cn: "牛肉", fr: "bœuf", py: "薄刷", cat: "食物人物" },
      { cn: "鸡肉", fr: "poulet", py: "布勒", cat: "食物人物" },
      { cn: "午饭", fr: "déjeuner", py: "得热内", cat: "食物人物" },
      { cn: "晚饭", fr: "dîner", py: "滴内", cat: "食物人物" },
      { cn: "面条", fr: "nouilles", py: "努依", cat: "食物人物" },
      { cn: "意大利面条", fr: "spaghetti", py: "撕怕给第", cat: "食物人物" },

      // 服装
      { cn: "手套", fr: "gant", py: "杠", cat: "服装" },
      { cn: "衣服", fr: "vêtement", py: "外特芒", cat: "服装" },
      { cn: "鞋子", fr: "chaussure", py: "说苏赫", cat: "服装" },
      { cn: "拖鞋", fr: "babouche / pantoufle", py: "八布食 / 帮杜夫勒", cat: "服装" },
      { cn: "帽子", fr: "chapeau", py: "沙波", cat: "服装" },
    ];

    // ========== 状态 ==========
    let mode = "card";
    let cardIndex = 0;
    let showAnswer = false;
    let shuffled = [...VOCAB];
    let quizIndex = 0;
    let quizScore = 0;
    let quizTotal = 0;
    let quizOptions = [];
    let quizAnswered = false;
    let currentFilter = "全部";
    let searchQuery = "";
    let learned = new Set(JSON.parse(localStorage.getItem("jianghu_learned") || "[]"));

    // ========== 工具函数 ==========
    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "fr-FR";
      u.rate = 0.85;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
    }

    function saveLearned() {
      localStorage.setItem("jianghu_learned", JSON.stringify([...learned]));
      updateStats();
    }

    function updateStats() {
      document.getElementById("stat-total").textContent = VOCAB.length;
      document.getElementById("stat-learned").textContent = learned.size;
      document.getElementById("stat-score").textContent = quizScore;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getCategories() {
      const cats = new Set(VOCAB.map(v => v.cat));
      return ["全部", ...cats];
    }

    function getFiltered() {
      let list = VOCAB;
      if (currentFilter !== "全部") {
        list = list.filter(v => v.cat === currentFilter);
      }
      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        list = list.filter(v =>
          v.cn.includes(q) ||
          v.fr.toLowerCase().includes(q) ||
          v.py.includes(q)
        );
      }
      return list;
    }

    // ========== 渲染 ==========
    function render() {
      const main = document.getElementById("main");
      if (mode === "card") renderCard(main);
      else if (mode === "quiz") renderQuiz(main);
      else if (mode === "list") renderList(main);
      else if (mode === "about") renderAbout(main);
      updateStats();
    }

    function renderCard(main) {
      if (cardIndex >= shuffled.length) cardIndex = 0;
      const item = shuffled[cardIndex];
      const progress = ((cardIndex + 1) / shuffled.length * 100).toFixed(0);

      main.innerHTML = `
        <div class="progress-bar"><div class="fill" style="width:${progress}%"></div></div>
        <div style="text-align:center;font-size:0.85rem;color:var(--text-muted);margin-bottom:8px;">
          ${cardIndex + 1} / ${shuffled.length}
        </div>
        <div class="flash-card">
          <div class="category">${item.cat}</div>
          <div class="cn">${item.cn}</div>
          ${showAnswer ? `
            <div class="fr">${item.fr}</div>
            <div class="py">${item.py}</div>
          ` : `
            <div class="hint">点击下方按钮查看法语与读音</div>
          `}
        </div>
        <div class="btn-row">
          ${showAnswer ? `
            <button class="btn btn-accent" onclick="speak('${item.fr.replace(/'/g, "\\'")}')">🔊 发音</button>
            <button class="btn btn-success" onclick="markLearned()">✓ 已掌握</button>
            <button class="btn btn-ghost" onclick="nextCard()">下一个 →</button>
          ` : `
            <button class="btn btn-primary" onclick="reveal()">显示答案</button>
            <button class="btn btn-ghost" onclick="nextCard()">跳过</button>
          `}
        </div>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn btn-ghost" onclick="prevCard()">← 上一个</button>
          <button class="btn btn-ghost" onclick="reshuffle()">🔀 重新打乱</button>
        </div>
      `;
    }

    function reveal() {
      showAnswer = true;
      render();
    }

    function nextCard() {
      showAnswer = false;
      cardIndex = (cardIndex + 1) % shuffled.length;
      render();
    }

    function prevCard() {
      showAnswer = false;
      cardIndex = (cardIndex - 1 + shuffled.length) % shuffled.length;
      render();
    }

    function reshuffle() {
      shuffled = shuffle(VOCAB);
      cardIndex = 0;
      showAnswer = false;
      render();
    }

    function markLearned() {
      const item = shuffled[cardIndex];
      learned.add(item.cn + "|" + item.fr);
      saveLearned();
      nextCard();
    }

    // ========== 测验 ==========
    window._currentQuizItem = null;

    function startQuiz() {
      quizIndex = 0;
      quizScore = 0;
      quizTotal = 20;
      quizAnswered = false;
      nextQuizQuestion();
    }

    function nextQuizQuestion() {
      if (quizIndex >= 20) {
        renderQuizResult();
        return;
      }
      // 随机抽一个还没考过的（简单起见直接随机）
      const correct = VOCAB[Math.floor(Math.random() * VOCAB.length)];
      window._currentQuizItem = correct;
      const wrongs = shuffle(VOCAB.filter(v => v.fr !== correct.fr)).slice(0, 3);
      quizOptions = shuffle([correct, ...wrongs]);
      quizAnswered = false;
      render();
    }

    function renderQuiz(main) {
      if (quizTotal === 0) {
        main.innerHTML = `
          <div class="empty">
            <p style="font-size:1.2rem;margin-bottom:16px;">准备好测试你的法语了吗？</p>
            <button class="btn btn-primary" onclick="startQuiz()">开始测验（20题）</button>
          </div>
        `;
        return;
      }

      if (quizIndex >= 20) {
        renderQuizResult();
        return;
      }

      const item = window._currentQuizItem;
      if (!item) {
        nextQuizQuestion();
        return;
      }

      main.innerHTML = `
        <div class="score-banner">
          第 \( {quizIndex + 1} / 20 题 · 当前得分 <span style="color:var(--accent)"> \){quizScore}</span>
        </div>
        <div class="quiz-question">${item.cn}</div>
        <div class="options" id="options">
          ${quizOptions.map((opt, i) => `
            <div class="option" onclick="selectOption(${i})">
              ${opt.fr}
            </div>
          `).join("")}
        </div>
      `;
    }

    function selectOption(idx) {
      if (quizAnswered) return;
      quizAnswered = true;
      const selected = quizOptions[idx];
      const correct = window._currentQuizItem;
      if (selected.fr === correct.fr) {
        quizScore++;
      }
      const optionsEl = document.getElementById("options");
      if (optionsEl) {
        optionsEl.querySelectorAll(".option").forEach((el, i) => {
          el.classList.add("disabled");
          if (quizOptions[i].fr === correct.fr) el.classList.add("correct");
          else if (i === idx && selected.fr !== correct.fr) el.classList.add("wrong");
        });
      }
      // 显示下一题按钮
      const main = document.getElementById("main");
      const btnRow = document.createElement("div");
      btnRow.className = "btn-row";
      btnRow.style.marginTop = "20px";
      btnRow.innerHTML = `
        <button class="btn btn-primary" onclick="goNextQuiz()">下一题 →</button>
        <button class="btn btn-accent" onclick="speak('${correct.fr.replace(/'/g, "\\'")}')">🔊 听发音</button>
      `;
      main.appendChild(btnRow);
      updateStats();
    }

    function goNextQuiz() {
      quizIndex++;
      if (quizIndex >= 20) {
        renderQuizResult();
      } else {
        nextQuizQuestion();
      }
    }

    function renderQuizResult() {
      const main = document.getElementById("main");
      const pct = Math.round((quizScore / 20) * 100);
      main.innerHTML = `
        <div class="score-banner">
          <div class="big">${quizScore} / 20</div>
          <div style="margin-top:8px;">正确率 ${pct}%</div>
        </div>
        <div style="text-align:center;margin:24px 0;">
          ${pct >= 80 ? "🎉 非常棒！继续保持！" : pct >= 60 ? "👍 不错，再接再厉！" : "💪 加油，多练习卡片吧！"}
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="startQuiz()">再测一次</button>
          <button class="btn btn-ghost" onclick="mode='card'; document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active')); document.querySelector('[data-mode=card]').classList.add('active'); render()">回到卡片</button>
        </div>
      `;
    }

    // ========== 单词本 ==========
    function renderList(main) {
      const cats = getCategories();
      const list = getFiltered();

      main.innerHTML = `
        <input class="search-box" type="search" placeholder="搜索中文 / 法语 / 读音…" value="${searchQuery}"
               oninput="searchQuery=this.value;render()" />
        <div class="filter-row">
          ${cats.map(c => `
            <button class="\( {currentFilter === c ? 'active' : ''}" onclick="currentFilter=' \){c}';render()">${c}</button>
          `).join("")}
        </div>
        <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px;">
          共 ${list.length} 个词
        </div>
        <div class="word-list">
          ${list.length === 0 ? `<div class="empty">没有找到匹配的词汇</div>` :
            list.map(item => `
              <div class="word-item">
                <div class="left">
                  <div class="cn">${item.cn} ${learned.has(item.cn + "|" + item.fr) ? "✅" : ""}</div>
                  <div class="fr">${item.fr}</div>
                  <div class="py">${item.py}</div>
                </div>
                <button class="speak-btn" onclick="speak('${item.fr.replace(/'/g, "\\'")}')">🔊</button>
              </div>
            `).join("")
          }
        </div>
      `;
    }

    // ========== 关于 ==========
    function renderAbout(main) {
      main.innerHTML = `
        <div class="about">
          <h2>关于本软件</h2>
          <p>本学习软件根据《江湖法语速成 / Le français facile》PDF 整理制作，专为中国在非洲 / 海外工地工作人员快速掌握实用法语口语设计。</p>
          <p><strong>功能说明：</strong></p>
          <ul>
            <li><strong>卡片模式</strong>：中文 → 法语 + 中文谐音读音，支持发音、标记已掌握</li>
            <li><strong>测验模式</strong>：20 题随机四选一，即时反馈 + 发音</li>
            <li><strong>单词本</strong>：按分类筛选、搜索、一键发音</li>
            <li><strong>离线使用</strong>：打开本 HTML 文件即可，数据保存在本地浏览器</li>
          </ul>
          <p style="margin-top:16px;"><strong>使用建议：</strong></p>
          <ul>
            <li>每天用卡片过 20～30 个词</li>
            <li>重点听发音，模仿跟读</li>
            <li>工地常用词优先（机械、工具、安全、时间）</li>
            <li>标记“已掌握”后可重点复习未掌握的</li>
          </ul>
          <p style="margin-top:16px;color:var(--accent);">数据来源：法语口语学习.pdf（扫描全能王）</p>
          <p style="font-size:0.85rem;margin-top:12px;">提示：浏览器需支持语音合成（Chrome / Edge / Safari 均可）。点击“发音”按钮即可听到标准法语读音。</p>
        </div>
      `;
    }

    // ========== 事件绑定 ==========
    document.getElementById("nav").addEventListener("click", (e) => {
      if (e.target.tagName === "BUTTON") {
        document.querySelectorAll("#nav button").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        mode = e.target.dataset.mode;
        if (mode === "quiz") {
          quizTotal = 0; // 重置到开始界面
        }
        if (mode === "card") {
          showAnswer = false;
        }
        render();
      }
    });

    // 初始化
    shuffled = shuffle(VOCAB);
    updateStats();
    render();
  </script>
</body>
</html>
